{% extends "base.html" %}
{% load i18n %}
{% block content %}
<a class="inline-flex min-h-11 items-center underline" href="{% url 'catalog_list' slug %}">{{ title }}</a>
<h1 class="text-2xl font-semibold">{{ record }}</h1>
<dl class="my-4 divide-y divide-stone-200 rounded-xl border border-stone-300 bg-white px-4">
  {% for label, value in fields %}
    <div class="grid gap-1 py-3 sm:grid-cols-2">
      <dt class="font-medium">{{ label }}</dt>
      <dd>{{ value|default_if_none:"—" }}</dd>
    </div>
  {% endfor %}
</dl>
{% if can_edit %}<a class="workspace-link" href="{% url 'catalog_edit' slug record.pk %}">{% translate "Edit record" %}</a>{% endif %}
{% endblock %}
