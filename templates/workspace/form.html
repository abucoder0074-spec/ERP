{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ title }} · Muzqaymoq ERP{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl rounded-2xl border border-stone-300 bg-white p-5">
  <h1 class="text-2xl font-semibold">{{ title }}</h1>
  {% if scan %}{% include "workspace/scanner.html" %}{% endif %}
  <form method="post" data-pending="{% translate 'Processing…' %}" class="login-form mt-5 space-y-4"{% if confirm %} data-confirm="{% translate 'Confirm this change?' %}"{% endif %}>
    {% csrf_token %}
    {{ form.as_p }}
    <button class="min-h-11 rounded-lg bg-[#215b45] px-4 text-white" type="submit">{% translate "Save" %}</button>
  </form>
</section>
{% endblock %}
